<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Shipping log: six public repositories between 30 June and 9 August 2026">
  <defs>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="tlclip"><rect x="1" y="1" width="1198" height="228" rx="16"/></clipPath>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c222a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="228" rx="16" fill="#0f1216" stroke="#2b323d"/>
  <g clip-path="url(#tlclip)"><rect width="1200" height="230" fill="url(#grid2)" opacity="0.45"/></g>

  <text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e" letter-spacing="1.6">SHIPPING LOG · 6 PUBLIC REPOSITORIES IN 41 DAYS</text>

  <!-- axis -->
  <line x1="110" y1="130" x2="1100" y2="130" stroke="#2b323d" stroke-width="2"/>
  <line x1="110" y1="130" x2="1100" y2="130" stroke="url(#axis)" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5b6572">
    <line x1="110"  y1="126" x2="110"  y2="134" stroke="#2b323d"/><text x="126" y="152" text-anchor="start">30 Jun</text>
    <line x1="357"  y1="126" x2="357"  y2="134" stroke="#2b323d"/>
    <line x1="605"  y1="126" x2="605"  y2="134" stroke="#2b323d"/>
    <line x1="852"  y1="126" x2="852"  y2="134" stroke="#2b323d"/><text x="852"  y="152" text-anchor="middle">30 Jul</text>
    <line x1="1100" y1="126" x2="1100" y2="134" stroke="#2b323d"/><text x="1084" y="152" text-anchor="end">9 Aug</text>
  </g>

  <!-- nodes: above -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <!-- shortlink-bypass, 30 Jun, Python -->
    <line x1="110" y1="130" x2="110" y2="90" stroke="#2b323d"/>
    <circle cx="110" cy="130" r="5.5" fill="#0f1216" stroke="#3572A5" stroke-width="2.5"/>
    <text x="110" y="82" text-anchor="middle" fill="#adbac7">shortlink-bypass</text>
    <text x="110" y="68" text-anchor="middle" fill="#5b6572">Python · ★1</text>

    <!-- valorant-fandom, 10 Jul -->
    <line x1="357" y1="130" x2="357" y2="90" stroke="#2b323d"/>
    <circle cx="357" cy="130" r="5.5" fill="#0f1216" stroke="#e34c26" stroke-width="2.5"/>
    <text x="357" y="82" text-anchor="middle" fill="#adbac7">valorant-fandom</text>
    <text x="357" y="68" text-anchor="middle" fill="#5b6572">HTML · Python</text>

    <!-- cloudflare-temp-sms, 20 Jul -->
    <line x1="605" y1="130" x2="605" y2="90" stroke="#2b323d"/>
    <circle cx="605" cy="130" r="5.5" fill="#0f1216" stroke="#f1e05a" stroke-width="2.5"/>
    <text x="605" y="82" text-anchor="middle" fill="#adbac7">cloudflare-temp-sms</text>
    <text x="605" y="68" text-anchor="middle" fill="#5b6572">JavaScript</text>
  </g>

  <!-- nodes: below -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <!-- comic-translator, 30 Jun -->
    <line x1="110" y1="130" x2="110" y2="172" stroke="#2b323d"/>
    <text x="110" y="188" text-anchor="middle" fill="#adbac7">comic-translator</text>
    <text x="110" y="202" text-anchor="middle" fill="#5b6572">Python</text>

    <!-- agent-setup, 19 Jul -->
    <line x1="580" y1="130" x2="580" y2="172" stroke="#2b323d"/>
    <circle cx="580" cy="130" r="5.5" fill="#0f1216" stroke="#8b949e" stroke-width="2.5"/>
    <text x="580" y="188" text-anchor="middle" fill="#adbac7">agent-setup</text>
    <text x="580" y="202" text-anchor="middle" fill="#5b6572">docs</text>

    <!-- aterkeep, 9 Aug -->
    <line x1="1100" y1="130" x2="1100" y2="172" stroke="#2b323d"/>
    <text x="1100" y="188" text-anchor="middle" fill="#e6edf3" font-weight="600">aterkeep</text>
    <text x="1100" y="202" text-anchor="middle" fill="#5b6572">Rust · ★3</text>
  </g>

  <!-- aterkeep node highlighted -->
  <circle cx="1100" cy="130" r="11" fill="#22c55e" opacity="0.16">
    <animate attributeName="r" values="7;15;7" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0;0.28" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="130" r="6" fill="#0f1216" stroke="#dea584" stroke-width="2.5"/>
</svg>
