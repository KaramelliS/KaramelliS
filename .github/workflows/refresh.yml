name: refresh profile

on:
  schedule:
    # Asks for every 10 minutes; GitHub does not honour that. Measured on
    # 2026-08-10: 1 scheduled run actually fired in 76 minutes, not 7. The
    # schedule event is best-effort and gets dropped under load, so treat this
    # as "eventually" rather than a cadence you can quote to anyone.
    #
    # Going faster would not help even if it were honoured: raw.githubusercontent
    # serves the committed SVGs with Cache-Control: max-age=300, so a viewer
    # cannot see a change sooner than five minutes after it lands. (Serving them
    # live from a Worker would be worse — external images go through camo, which
    # caches for 86400s.)
    #
    # For a tighter guarantee, the fix is an external ping to workflow_dispatch,
    # not a smaller cron number.
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # Deliberately NOT triggered by changes under assets/ — this job commits
    # to assets/, so watching it would make the workflow retrigger itself.
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PROFILE_TOKEN is optional. The job's own GITHUB_TOKEN can read the
      # public contribution calendar; set the secret only if that ever stops
      # being true, and it will be picked up without editing this file.
      - name: Rebuild the SVGs from live data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          # Set only when a personal token is in play. The API cannot be asked
          # whether it is hiding private work — with GITHUB_TOKEN it reports
          # zero restricted contributions and simply omits them — so the label
          # is driven from here instead of guessed.
          COUNTS_PRIVATE: ${{ secrets.PROFILE_TOKEN != '' && '1' || '' }}
        run: python scripts/build.py

      - name: Commit if anything actually moved
        run: |
          if [ -z "$(git status --porcelain assets README.md)" ]; then
            echo "No change — the numbers are the same as last run."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "Refresh profile stats"
          git push
